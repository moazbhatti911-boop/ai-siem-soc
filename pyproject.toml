[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-siem-soc"
version = "0.1.0"
description = "AI-Powered SIEM & SOC Platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "psutil",
    "pydantic",
    "python-dotenv",
    "streamlit",
    "scikit-learn",
    "numpy",
    "pytest",
]

[tool.setuptools]
packages = ["ingestor", "ai_engine", "server", "dashboard", "cli", "shared"]
